<html lang="es">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#04070a;--tx:#eef2f1;--tx2:#a9b6b3;--tx3:#6c7a77;--acc:#7fe0c4;--mono:'JetBrains Mono',ui-monospace,monospace;--sans:Inter,system-ui,sans-serif;--cond:'Barlow Condensed',Inter,sans-serif}
*{box-sizing:border-box}html{scroll-behavior:auto}body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--sans)}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
.top{position:fixed;left:0;right:0;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 28px;font-size:12px;color:var(--tx2);background:linear-gradient(rgba(4,7,10,.8),transparent)}
.top a{color:var(--tx2);text-decoration:none}.top a:hover{color:var(--tx)}.top .ix{font-family:var(--mono);font-size:11px;letter-spacing:.06em}
.top nav{display:flex;gap:4px}.top nav a{padding:4px 9px;border-radius:6px;font-size:12px}.top nav a.on{color:var(--tx);box-shadow:inset 0 -1.5px 0 var(--acc)}
#marcoG{position:fixed;inset:56px 22px 22px;z-index:1;pointer-events:none;border:1px solid rgba(255,255,255,.06)}
/* recuadro grande con la especie en puntos */
#inset{position:fixed;z-index:4;width:var(--s);height:var(--s);--s:min(46vh,36vw);left:52%;top:50%;transform:translateY(-55%);pointer-events:none;opacity:0;transition:opacity .5s,left .6s cubic-bezier(.2,.8,.2,1)}
#inset.on{opacity:1}
#inset canvas{width:100%;height:100%;display:block;background:radial-gradient(circle at 50% 45%,#16211f,#05080a 75%);border:1px solid rgba(255,255,255,.22)}
#inset .n{position:absolute;right:8px;top:6px;font:500 10px var(--mono);color:var(--tx2)}
#inset .cap{position:absolute;left:0;top:calc(100% + 8px);font:500 11px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--tx)}
#inset .cap i{display:block;font:italic 400 11px var(--sans);letter-spacing:0;text-transform:none;color:var(--tx2);margin-top:3px}
/* encuadre en la escena: dónde está el animal a lo lejos */
#enc{position:fixed;z-index:3;left:0;top:0;width:60px;height:60px;pointer-events:none;opacity:0;transition:opacity .4s}
#enc.on{opacity:1}#enc::before,#enc::after,#enc b::before,#enc b::after{content:'';position:absolute;width:12px;height:12px;border:1.5px solid var(--acc)}
#enc::before{left:0;top:0;border-right:0;border-bottom:0}#enc::after{right:0;top:0;border-left:0;border-bottom:0}#enc b::before{left:0;bottom:0;border-right:0;border-top:0}#enc b::after{right:0;bottom:0;border-left:0;border-top:0}
#enc em{position:absolute;left:0;top:calc(100% + 5px);font:500 9.5px var(--mono);letter-spacing:.14em;color:var(--acc);font-style:normal;white-space:nowrap;text-transform:uppercase}
svg#hilo{position:fixed;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
/* textos que suben con el scroll */
main{position:relative;z-index:5;pointer-events:none}
section{height:100vh;display:flex;align-items:flex-end;padding:0 0 9vh 6vw}
section.hero{align-items:center}
.tx{max-width:420px;pointer-events:auto}
.tx .ey{font:500 11px var(--mono);letter-spacing:.18em;color:var(--acc);text-transform:uppercase}
.tx h1,.tx h2{margin:10px 0 12px;font:300 clamp(40px,6vw,78px)/.95 var(--cond);letter-spacing:.01em;text-transform:uppercase}
.tx h2{font-size:clamp(34px,4.6vw,60px)}
.tx p{margin:0;font-size:14.5px;line-height:1.6;color:#d6dfdc;text-shadow:0 1px 10px rgba(0,0,0,.9)}
.tx .rel{display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:6px 11px;border:1px solid rgba(255,255,255,.18);font:500 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--tx)}
.tx .rel i{width:8px;height:8px;border-radius:50%}
.tx .baja{display:inline-flex;gap:10px;align-items:center;margin-top:24px;padding:12px 18px;border:1px solid rgba(255,255,255,.3);font:500 11px var(--mono);letter-spacing:.18em;color:var(--tx);text-decoration:none;text-transform:uppercase}
.tx .baja:hover{background:rgba(255,255,255,.06)}
.tx .fin{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.tx .fin a{padding:11px 16px;border:1px solid rgba(255,255,255,.28);font:500 11px var(--mono);letter-spacing:.14em;color:var(--tx);text-decoration:none;text-transform:uppercase}.tx .fin a:hover{background:rgba(255,255,255,.07)}
.pie{position:fixed;right:28px;bottom:24px;z-index:6;display:flex;gap:18px;align-items:center;font-size:10.5px;color:var(--tx3)}
.pie button{all:unset;cursor:pointer;color:var(--tx2);font-size:11.5px}.pie button:hover{color:var(--tx)}.pie span{max-width:520px;text-align:right}

a:focus-visible,button:focus-visible{outline:1px solid var(--acc);outline-offset:3px}
@media(max-width:760px){
  .top{padding:10px 14px}.top nav,.top .ix span{display:none}

  .pie span{display:none}.pie{right:16px;bottom:14px}.prog{right:6px}
}
@media(prefers-reduced-motion:reduce){#inset,#enc{transition:none}}

<div id="marcoG"></div>

<script type="module">
import * as THREE from 'three';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let RMQ = matchMedia('(prefers-reduced-motion: reduce)').matches; const MOV = innerWidth <= 760;
const M = await fetch('data3d/puntos/bavaria_campo.json?v=6').then(r => r.json());
const ESP = M.especies, porK = Object.fromEntries(ESP.map(e => [e.k, e]));

/* ---------- las interacciones que se encuadran con el scroll ---------- */
const SEC = [
  ['colibri', 'cilantro', 'Polinización', 'Colibrí', 'Flota frente a las flores y toma su néctar; el polen se le pega al pico y lo lleva a la siguiente flor.'],
  ['abeja', 'cilantro', 'Polinización', 'Abeja de miel', 'Viene del apiario del distrito y visita las flores del cilantro: poliniza la huerta y produce miel para el mercado.'],
  ['mariposa', 'cilantro', 'Polinización', 'Mariposa', 'Toma néctar de las franjas de flores. Que llegue es señal de una huerta sin venenos.'],
  ['mariquita', 'lechuga', 'Control de plagas', 'Mariquita', 'Camina por la lechuga comiéndose los pulgones: la huerta no necesita plaguicidas.'],
  ['copeton', 'acelga', 'Control de plagas', 'Copetón', 'Salta entre las camas comiendo semillas de maleza y orugas; anida en los árboles que se conservan.'],
  ['mirla', 'lombriz', 'Depredación', 'Mirla patiamarilla', 'Busca en el suelo húmedo de los caminos y saca lombrices e insectos.'],
  ['lombriz', 'lechuga', 'Suelo vivo', 'Lombriz roja', 'Convierte el compost del distrito en tierra fértil para todas las camas.'],
  ['murcielago', 'urapan', 'Refugio', 'Murciélago', 'Al anochecer sale de los refugios de los árboles y caza las polillas del invernadero.']
].filter(s => porK[s[0]]);
$('secs').innerHTML = `<section class="hero" id="s0"><div class="tx"><div class="ey">Bavaria Común · huertas de enseñanza</div><h1>Tramas de vida en la huerta</h1>
<p>Las huertas del distrito junto a los árboles que ya existen, en puntos. Baja con el scroll: cada parada encuadra una especie que llega a la huerta y lo que hace en ella.</p>
<a class="baja" href="#s1">Desliza ↓</a></div></section>` +
  SEC.map(([k, b, t, n, d], i) => `<section id="s${i + 1}"><div class="tx"><div class="ey">${String(i + 1).padStart(2, '0')} · ${esc(t)}</div><h2>${esc(n)}</h2><p>${esc(d)}</p>
  <span class="rel"><i style="background:${M.tipos[t] || '#fff'}"></i>${esc(n)} → ${esc((porK[b] || {}).n || '')}</span></div></section>`).join('') +
  `<section id="s${SEC.length + 1}"><div class="tx"><div class="ey">La trama completa</div><h2>${M.rel.length} relaciones entre ${ESP.length} especies</h2>
  <p>Polinizadores, aves que comen plagas y el suelo vivo trabajan para la huerta; los árboles existentes les dan refugio. Así se enseña a cultivar en Bavaria Común.</p>
  <div class="fin"><a href="index.html">Volver al simulador</a><a href="bavaria_interior.html?e=bio">Entrar a los edificios</a></div></div></section>`;
$('prog').innerHTML = Array.from({ length: SEC.length + 2 }, (_, i) => `<a href="#s${i}" aria-label="Sección ${i}"></a>`).join('');
$('nav').innerHTML = [['s0', 'Inicio'], ['s1', 'Polinización'], [`s${SEC.findIndex(s => s[2] === 'Control de plagas') + 1}`, 'Plagas'], [`s${SEC.findIndex(s => s[2] === 'Depredación') + 1}`, 'Suelo y aves'], [`s${SEC.length + 1}`, 'La trama']].map(([h, n]) => `<a href="#${h}">${n}</a>`).join('');

/* ---------- nube de puntos de la huerta ---------- */
const resp = await fetch('data3d/puntos/bavaria_campo.bin?v=3'), tot = +resp.headers.get('content-length') || M.n * 9, rd = resp.body.getReader(), partes = []; let lle = 0;
for (;;) { const { done, value } = await rd.read(); if (done) break; partes.push(value); lle += value.length; $('cb').style.width = Math.min(100, lle / tot * 100) + '%'; }
const raw = new Uint8Array(lle); { let o = 0; for (const p of partes) { raw.set(p, o); o += p.length; } }
const N = M.n, I16 = new Int16Array(raw.buffer, 0, N * 3), COL = raw.subarray(N * 6, N * 9);
const paso = MOV ? 2 : 1, n = Math.floor(N / paso), pos = new Float32Array(n * 3), col = new Float32Array(n * 3), rnd = new Float32Array(n);
for (let i = 0, j = 0; j < n; i += paso, j++) { for (let a = 0; a < 3; a++) { pos[j * 3 + a] = I16[i * 3 + a] * M.esc; col[j * 3 + a] = COL[i * 3 + a] / 255; } rnd[j] = Math.random(); }
const cv = $('c'), R = new THREE.WebGLRenderer({ canvas: cv, antialias: true, powerPreference: 'high-performance' });
R.setPixelRatio(Math.min(2, devicePixelRatio || 1)); R.setClearColor(0x04070a, 1);
const S = new THREE.Scene(), cam = new THREE.PerspectiveCamera(M.fov, innerWidth / innerHeight, 0.05, 3000);
const U = { uT: { value: 0 }, uPx: { value: R.getPixelRatio() * innerHeight }, uIn: { value: 0 }, uZ: { value: 1 } };
const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setAttribute('color', new THREE.BufferAttribute(col, 3)); g.setAttribute('r', new THREE.BufferAttribute(rnd, 1));
// puntos finos, con un velo frío en la distancia (como la referencia) y brillo en los bordes de las hojas
const mat = new THREE.ShaderMaterial({ uniforms: U, vertexColors: true, transparent: true, depthWrite: false,
  vertexShader: `attribute float r; varying vec3 vC; varying float vA; uniform float uT, uPx, uIn, uZ;
    void main(){ vec3 p = position; float h = fract(r * 91.7);
      p += (vec3(fract(r*13.1), fract(r*7.3), fract(r*3.7)) - 0.5) * 0.004 * length(position);
      if (p.y > 1.2) p.x += sin(uT * 1.3 + p.y * 0.4 + r * 6.0) * 0.015 * (p.y - 1.2);
      float rise = smoothstep(r * 0.6, r * 0.6 + 0.4, uIn); p.y -= (1.0 - rise) * (2.0 + r * 6.0);
      vec4 mv = modelViewMatrix * vec4(p, 1.0); gl_Position = projectionMatrix * mv; float d = -mv.z;
      gl_PointSize = clamp(uPx * 0.0026 * uZ * (0.7 + h * 0.6) / max(d, 0.1) * 6.0, 1.0, 3.6 * uZ);
      float lejos = smoothstep(18.0, 160.0, d); vec3 c = color * (0.84 + h * 0.3);
      c = mix(c, vec3(0.42, 0.78, 0.74) * (0.45 + dot(color, vec3(.33))), lejos * 0.55); // velo frío a lo lejos
      vC = c * mix(1.0, 0.45, smoothstep(120.0, 320.0, d)); vA = rise * mix(1.0, 0.6, lejos); }`,
  fragmentShader: `varying vec3 vC; varying float vA; void main(){ vec2 q = gl_PointCoord - 0.5; float d = dot(q, q); if (d > 0.25) discard; gl_FragColor = vec4(vC, vA * smoothstep(0.25, 0.1, d));
    #include <colorspace_fragment>
  }` });
S.add(new THREE.Points(g, mat));

/* ---------- especies en PUNTOS desde fotografías (tools/puntos/especies_puntos.py) ---------- */
const EI = await fetch('data3d/puntos/esp/esp.json?v=1').then(r => r.json()).catch(() => ({}));
const NUBE = {}; await Promise.all(Object.keys(EI).map(async k => { const b = new Uint8Array(await fetch(`data3d/puntos/esp/${k}.bin?v=1`).then(r => r.arrayBuffer())); NUBE[k] = { n: EI[k].n, q: new Int16Array(b.buffer, 0, EI[k].n * 3), c: b.subarray(EI[k].n * 6) }; }));
const matEsp = (uPx, tam) => new THREE.ShaderMaterial({ uniforms: { uPx, uTam: { value: tam } }, vertexColors: true,
  vertexShader: 'uniform float uPx, uTam; varying vec3 vC; void main(){ vC = color; vec4 mv = modelViewMatrix * vec4(position, 1.0); gl_Position = projectionMatrix * mv; gl_PointSize = clamp(uTam * uPx / max(-mv.z, 0.02), 1.2, 9.0); }',
  fragmentShader: 'varying vec3 vC; void main(){ vec2 q = gl_PointCoord - 0.5; if (dot(q,q) > 0.25) discard; gl_FragColor = vec4(vC, 1.0);\n#include <colorspace_fragment>\n}' });
const geoEsp = (k, max) => { const E = NUBE[k], st = Math.max(1, Math.floor(E.n / max)), m = Math.floor(E.n / st), P = new Float32Array(m * 3), C = new Float32Array(m * 3);
  for (let i = 0, j = 0; j < m; i += st, j++) { for (let a = 0; a < 3; a++) { P[j * 3 + a] = E.q[i * 3 + a] / 1000; C[j * 3 + a] = Math.pow(E.c[i * 3 + a] / 255, 2.2); } } // los colores de la foto vienen en sRGB
  const gg = new THREE.BufferGeometry(); gg.setAttribute('position', new THREE.BufferAttribute(P, 3)); gg.setAttribute('color', new THREE.BufferAttribute(C, 3)); return gg; };
// tamaño en la escena (m): real × aumento para que se lea a la distancia de la vista
const TAM = { colibri: 0.11 * 2.4, abeja: 0.018 * 7, abejorro: 0.025 * 6, mariposa: 0.06 * 4, mariquita: 0.009 * 9, mirla: 0.26 * 1.8, copeton: 0.15 * 2.2, lombriz: 0.12 * 1.6, murcielago: 0.1 * 2.6 };
const SUELO = { mirla: 1, copeton: 1, lombriz: 1, mariquita: 1 }, BILL = [];
const modelo = (k) => { if (!NUBE[k]) return null; const w = new THREE.Group(), s = TAM[k] || 0.2, pts = new THREE.Points(geoEsp(k, MOV ? 2500 : 6000), matEsp(U.uPx, 0.0016 * s * 6));
  pts.scale.setScalar(s); if (SUELO[k]) pts.position.y = s * 0.5; w.add(pts); BILL.push(pts); return w; };
const { crearFauna3D } = await import('./data3d/puntos/fauna3d.js?v=7');
const FAUNA = crearFauna3D({ THREE, S, M, RMQ, modelo });

// sensores de la huerta (suelo, riego, polinizadores): puntos que titilan sobre las camas
{ const SP = []; for (let j = 0; j < n && SP.length < (MOV ? 30 : 60); j += 97) { const x = pos[j * 3], y = pos[j * 3 + 1], z = pos[j * 3 + 2], gC = col[j * 3 + 1];
    if (y > -1.35 && y < -0.85 && Math.hypot(x, z) < 30 && gC > col[j * 3] * 1.15) SP.push(x, y + 0.35, z); }
  const gs = new THREE.BufferGeometry(); gs.setAttribute('position', new THREE.Float32BufferAttribute(SP, 3)); const ph = new Float32Array(SP.length / 3).map(() => Math.random() * 6.28); gs.setAttribute('ph', new THREE.BufferAttribute(ph, 1));
  S.add(new THREE.Points(gs, new THREE.ShaderMaterial({ uniforms: U, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    vertexShader: 'attribute float ph; uniform float uT, uPx; varying float vA; void main(){ vec4 mv = modelViewMatrix * vec4(position,1.0); gl_Position = projectionMatrix * mv; vA = 0.25 + 0.75 * pow(0.5 + 0.5 * sin(uT * 2.0 + ph), 4.0); gl_PointSize = clamp(uPx * 0.006 / max(-mv.z, 0.5) * 6.0, 2.0, 9.0); }',
    fragmentShader: 'varying float vA; void main(){ vec2 q = gl_PointCoord - 0.5; float d = dot(q,q); if (d > 0.25) discard; gl_FragColor = vec4(0.5, 1.0, 0.86, vA * smoothstep(0.25, 0.0, d));\n#include <colorspace_fragment>\n}' }))); }

/* ---------- recuadro grande: la especie en puntos, girando despacio ---------- */
const RI = new THREE.WebGLRenderer({ canvas: $('ic'), antialias: true, alpha: true }); RI.setPixelRatio(Math.min(2, devicePixelRatio || 1)); RI.setSize(512, 512, false); RI.setClearColor(0x000000, 0);
const SI = new THREE.Scene(), camI = new THREE.PerspectiveCamera(30, 1, 0.01, 50); camI.position.set(0, 0, 2.3); const uPxI = { value: 512 * Math.min(2, devicePixelRatio || 1) };
const INS = {}; for (const [k] of SEC) if (NUBE[k]) { const p = new THREE.Points(geoEsp(k, 90000), matEsp(uPxI, 0.0032)); p.visible = false; SI.add(p); INS[k] = p; }

/* ---------- cámara guiada por el scroll ---------- */
const L0 = new THREE.Vector3(M.look[0] - M.eye[0], M.look[1] - M.eye[1], M.look[2] - M.eye[2]).normalize();
const lookBase = L0.clone().multiplyScalar(30), look = lookBase.clone(), tmp = new THREE.Vector3();
let s = 0, sObj = 0, fov = M.fov;
const agenteDe = (k) => { const c = FAUNA.agentes.filter(a => a.k === k); return c.find(a => a.espera > 0) || c[0]; };
const SEL = {}; SEC.forEach(([k]) => { SEL[k] = agenteDe(k); });
const cam0 = new THREE.PerspectiveCamera(M.fov, innerWidth / innerHeight, 0.05, 3000); cam0.lookAt(L0); cam0.updateMatrixWorld(); const vN = new THREE.Vector3();
// la cámara no mira fuera de lo que se capturó (abajo y a los lados no hay puntos)
const dentroCaptura = (v) => { vN.copy(v).project(cam0); vN.x = Math.max(-0.55, Math.min(0.55, vN.x)); vN.y = Math.max(-0.35, Math.min(0.6, vN.y)); return v.copy(vN.unproject(cam0)); };
const objetivo = (i) => { if (i <= 0 || i > SEC.length) return lookBase; const a = SEL[SEC[i - 1][0]]; return a ? a.obj.position : lookBase; };
function leerScroll() { sObj = scrollY / innerHeight; }
addEventListener('scroll', leerScroll, { passive: true });
function tam() { R.setSize(innerWidth, innerHeight, false); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); U.uPx.value = R.getPixelRatio() * innerHeight; leerScroll(); }
addEventListener('resize', tam); tam();
$('pausa').onclick = () => { RMQ = !RMQ; $('pausa').textContent = RMQ ? 'Reanudar movimiento' : 'Pausar movimiento'; };
$('nota').textContent = 'Huertas reconstruidas con puntos desde el modelo 3D del simulador; especies reconstruidas con puntos desde fotografías (iNaturalist, CC) y una profundidad estimada: representación, no un levantamiento. Animales aumentados para que se vean.';

/* ---------- cuadro ---------- */
const V = new THREE.Vector3(), V2 = new THREE.Vector3(); let t0 = performance.now(), tPrev = t0, secAct = -1;
$('carga').style.opacity = 0; setTimeout(() => $('carga').remove(), 900);
